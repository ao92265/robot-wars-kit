<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Wars — Tournament</title>
<style>
  :root { --bg:#08090A; --panel:#0F1011; --panel-2:#141516; --raised:#1C1C1F; --line:#23252A;
          --line-2:#34343A; --ink:#F7F8F8; --dim:#8A8F98; --faint:#62666D;
          --accent:#3fd0c9; --gold:#ffd93d; --red:#eb0400;
          --font-display:-apple-system,'SF Pro Display','Segoe UI Variable Display','Segoe UI',Roboto,sans-serif;
          --font-mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
              font-family:var(--font-display); }
  button, label.file { background:var(--raised); color:var(--ink); border:1px solid var(--line-2);
           padding:8px 13px; border-radius:6px; cursor:pointer; white-space:nowrap;
           font:700 11px/1.2 var(--font-display); letter-spacing:.08em; text-transform:uppercase; }
  button:hover, label.file:hover { background:#232327; }
  button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input[type=range] { vertical-align:middle; width:120px; }
  input[type=file] { display:none; }

  /* ===== leaderboard strip (match view only; single panel bar) ===== */
  #lb-strip { position:fixed; top:0; left:0; right:0; height:38px; z-index:9; display:flex;
              align-items:stretch; padding:0 16px; background:var(--panel);
              border-bottom:1px solid var(--line); backdrop-filter:blur(6px);
              overflow:hidden; pointer-events:none; transition:transform .25s, opacity .25s; }
  body:not(.playing) #lb-strip { display:none; }
  /* strip hides with the rest of the chrome while the match runs */
  body.rw-playing:not(.showui) #lb-strip { transform:translateY(-100%); opacity:0; }
  #lb-strip .lbs-label { font-size:10px; letter-spacing:3px; text-transform:uppercase;
              color:var(--gold); font-weight:900; flex:0 0 auto; display:flex; align-items:center;
              padding-right:14px; }
  .lbs-seg { display:flex; align-items:center; gap:8px; flex:0 0 auto; padding:0 14px;
             font-family:var(--font-mono); font-size:12px; font-weight:700;
             border-left:1px solid var(--line); }
  .lbs-seg .lbs-rank { color:var(--dim); }
  .lbs-seg .lbs-rec { color:var(--dim); font-variant-numeric:tabular-nums; }
  .lbs-seg.out, .lbs-seg.out .lbs-rank, .lbs-seg.out .lbs-rec { color:var(--faint); }
  .lbs-seg.lead { border-left:3px solid var(--gold); }

  /* ===== two top-level views ===== */
  #bracketview, #matchview { position:fixed; inset:0; top:38px; }
  #matchview { display:none; }
  body.playing #bracketview { display:none; }
  body.playing #matchview { display:block; top:0; }   /* stage fills the viewport */

  /* ===== BRACKET VIEW (World-Cup style) ===== */
  #bracketview { top:0; display:flex; flex-direction:column; background:
      radial-gradient(ellipse at 50% -10%, #141516 0%, #08090A 60%); }
  #bhead { display:flex; align-items:center; gap:14px; padding:14px 26px; border-bottom:1px solid var(--line);
           background:var(--panel); backdrop-filter:blur(6px); z-index:5; }
  #bhead h1 { font-size:20px; margin:0; letter-spacing:2px; font-weight:900; }
  #bhead h1 b { color:var(--accent); font-weight:900; }
  #bhead .tag { font-size:11px; color:var(--dim); letter-spacing:2px; text-transform:uppercase;
                border-left:1px solid var(--line-2); padding-left:14px; }
  #bhead .spacer { flex:1; }
  #playnext { background:linear-gradient(180deg,#2ec4b6,#1b9c90); border:none; color:#04120f; font-weight:800;
              font-size:13px; letter-spacing:.06em; padding:11px 20px; box-shadow:0 6px 22px #2ec4b655; }
  #playnext:disabled { background:var(--raised); color:var(--dim); box-shadow:none; }
  #bbody { flex:1; display:flex; min-height:0; }

  /* bracket tree: one column per round, connectors drawn in the SVG layer */
  #bracket { flex:1; position:relative; display:flex; gap:44px; align-items:stretch; overflow:auto;
             padding:18px 44px 30px; max-width:1240px; margin:0 auto; }
  #bracket-svg { position:absolute; inset:0; pointer-events:none; z-index:0; overflow:visible; }
  .round { position:relative; z-index:1; display:flex; flex-direction:column; min-width:244px; }
  .round-title { flex:0 0 auto; text-align:center; font-size:16px; letter-spacing:3px; text-transform:uppercase;
                 color:var(--dim); font-weight:800; margin-bottom:16px; }
  .round.current .round-title { color:var(--accent); }
  .round-ties { flex:1; display:flex; flex-direction:column; justify-content:space-around; gap:16px; }
  .tie { position:relative; display:flex; flex-direction:column; gap:0; border:1px solid var(--line);
         border-radius:10px; overflow:hidden; background:var(--panel); box-shadow:0 6px 20px #0006;
         transition:transform .2s, box-shadow .2s, border-color .2s; }
  .tie.playable { cursor:pointer; overflow:visible; transform:scale(1.04); border-color:#3fd0c9;
                  box-shadow:0 0 0 1px #3fd0c9, 0 12px 40px rgba(63,208,201,.25); }
  .tie.playable:hover { transform:scale(1.04) translateY(-2px); }
  .upnext-pill { position:absolute; top:-9px; right:-10px; z-index:2; background:#3fd0c9; color:#04120f;
                 font-size:10px; letter-spacing:.2em; text-transform:uppercase; font-weight:900;
                 padding:3px 9px; border-radius:999px; box-shadow:0 4px 14px rgba(63,208,201,.4); }
  .tie.pending { border:1px dashed var(--line); box-shadow:none; }
  .tie.pending .meta { color:var(--faint); }
  .slot { display:flex; align-items:center; gap:11px; padding:11px 13px; font-size:15px; font-weight:700; }
  .slot + .slot { border-top:1px solid var(--line); }
  .slot .crest { width:26px; height:26px; border-radius:8px; flex:0 0 auto; display:flex; align-items:center;
                 justify-content:center; font-size:13px; font-weight:900; color:#06101d;
                 box-shadow:0 0 11px currentColor; background:var(--line-2); }
  .slot.tbd .crest { box-shadow:none; background:var(--raised); color:var(--faint); }
  .slot .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:20px; }
  .slot .sc { flex:0 0 auto; color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px; }
  .slot.win { color:#fff; background:linear-gradient(90deg,#12351f55,transparent); }
  .slot.win .sc { color:var(--gold); }
  .slot.win .sc::after { content:" ✓"; color:#2ec4b6; }
  .slot.lose { opacity:.4; filter:grayscale(.65); }
  .slot.tbd .nm { color:var(--faint); font-style:italic; font-weight:600; }
  .tie .meta { padding:5px 13px; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase;
               color:var(--dim); border-top:1px dashed var(--line-2); text-align:center; }
  .tie.playable .meta { color:#2ec4b6; font-weight:800; }
  .bye-tag { font-size:10px; color:var(--dim); letter-spacing:2px; }

  /* champion column */
  .champ-col { display:flex; flex-direction:column; min-width:220px; }
  .champ-col .round-ties { justify-content:center; }
  .champ-box { border:1px solid #40371a; border-radius:14px; padding:22px 18px; text-align:center;
               background:linear-gradient(180deg,#1a1608,#0b0c10); }
  .champ-box .lbl { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); }
  .champ-box .cup { font-size:46px; margin:6px 0; filter:drop-shadow(0 0 16px #ffd93d88); }
  .champ-box .nm { font-size:22px; font-weight:900; letter-spacing:1px; }
  .champ-box.tbd .nm { color:var(--faint); font-style:italic; font-size:16px; }

  /* leaderboard */
  #leaderboard { width:290px; flex:0 0 auto; border-left:1px solid var(--line); background:var(--panel);
                 padding:20px 18px; overflow:auto; }
  #leaderboard h2 { font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--dim);
                    margin:0 0 14px; font-weight:800; }
  .lb-row { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:14px;
            margin-bottom:6px; background:var(--panel-2); border:1px solid var(--line); }
  .lb-row.out { opacity:.45; filter:grayscale(.7); }
  .lb-row .rank { width:18px; color:var(--dim); font-weight:800; text-align:center; }
  .lb-row .dot { width:12px; height:12px; border-radius:4px; box-shadow:0 0 9px currentColor; }
  .lb-row .nm { flex:1; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-row .rec { color:var(--dim); font-variant-numeric:tabular-nums; font-size:12px; font-family:var(--font-mono); }
  .lb-row.champ { border-color:var(--gold); box-shadow:0 0 0 1px #ffd93d55; }
  .lb-note { color:var(--dim); font-size:11px; margin-top:12px; line-height:1.5; }

  /* ===== awards overlay (end of day: champion + honorable mentions) ===== */
  #awards { position:fixed; inset:0; z-index:20; display:none; flex-direction:column; align-items:center;
            justify-content:center; gap:14px; text-align:center;
            background:radial-gradient(ellipse at 50% -10%, #1a1608ee 0%, #08090Af8 65%); }
  #awards.show { display:flex; }
  #awards .aw-lbl { font-size:13px; letter-spacing:6px; text-transform:uppercase; color:var(--gold); font-weight:900; }
  #awards .aw-cup { font-size:104px; filter:drop-shadow(0 0 40px #ffd93d99); margin:-8px 0; }
  #awards .aw-champ { font-size:62px; font-weight:900; letter-spacing:2px;
            text-shadow:0 0 40px #ffd93d66, 0 4px 12px #000; }
  #awards .aw-hm-title { font-size:12px; letter-spacing:4px; text-transform:uppercase; color:var(--dim);
            font-weight:800; margin-top:20px; }
  #awards .aw-hm { display:flex; flex-direction:column; gap:10px; min-width:520px; max-width:72vw; }
  .aw-mention { font-size:20px; font-weight:700; background:#0F1011cc; border:1px solid var(--line);
            border-radius:12px; padding:12px 20px; outline:none; }
  .aw-mention:focus { border-color:var(--accent); }
  .aw-mention:empty::before { content:"🏅 type an honorable mention… (e.g. kudos to Azure — broke the game)";
            color:var(--faint); font-style:italic; font-weight:600; }
  #aw-close { position:absolute; top:14px; right:22px; }

  /* ===== MATCH VIEW (embeds the 3D arena; arena.app.js needs these IDs) ===== */
  #mwrap { display:flex; flex-direction:column; height:100%; position:relative; }
  /* control bar overlays the stage (below the 38px strip); auto-hides in playback */
  #mbar { position:absolute; left:0; right:0; top:38px; z-index:8; display:flex; align-items:center;
          gap:12px; padding:10px 18px; background:#0F1011f2; border-bottom:1px solid var(--line);
          backdrop-filter:blur(6px); transition:transform .25s, opacity .25s; }
  body.rw-playing:not(.showui) #mbar { transform:translateY(calc(-100% - 38px)); opacity:0; }
  #mbar h1 { font-size:15px; margin:0; letter-spacing:1px; font-weight:900; }
  #mbar h1 b { color:var(--accent); font-weight:900; }
  #mbar .mtitle { font-size:13px; color:var(--accent); font-weight:700; letter-spacing:.5px; }
  #mbar .spacer { flex:1; }
  #mbar .speedlbl { font:700 10px var(--font-display); letter-spacing:.08em; color:var(--dim);
                    text-transform:uppercase; }
  #mbar .speedval { font:700 11px var(--font-mono); color:var(--ink); font-variant-numeric:tabular-nums;
                    min-width:46px; }
  #back { border-color:var(--accent); color:var(--accent); font-weight:700; }
  #stage { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  /* debug chip (?debug only): bottom-left, hides with the chrome */
  #hud { position:absolute; bottom:14px; left:18px; font:600 10px var(--font-mono); color:var(--faint);
         letter-spacing:.08em; font-variant-numeric:tabular-nums; pointer-events:none;
         transition:opacity .25s; }
  body.rw-playing:not(.showui) #hud { opacity:0; }
  /* victory lower-third card: winner + team color + trophy. Slides up over the
     still-visible arena (no full-stage overlay that buries the hero shot). */
  #banner { position:absolute; left:50%; bottom:15vh; z-index:6;
            transform:translateX(-50%) translateY(34px); opacity:0; pointer-events:none;
            display:grid; grid-template-columns:auto 1fr; grid-template-areas:"trophy who" "trophy sub";
            column-gap:20px; align-items:center; text-align:left; padding:18px 34px 18px 26px;
            background:linear-gradient(100deg,#0F1011f7,#141516f0); border:1px solid var(--line);
            border-left:5px solid var(--wincol,var(--gold)); border-radius:12px;
            box-shadow:0 22px 70px #000b, 0 0 70px -18px var(--wincol,var(--gold));
            transition:opacity .55s ease, transform .55s cubic-bezier(.2,.9,.3,1); }
  #banner.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #banner::before { content:"🏆"; grid-area:trophy; font-size:52px; line-height:1;
                    filter:drop-shadow(0 3px 8px #000b); }
  #banner .who { grid-area:who; font-size:46px; font-weight:900; font-style:italic; letter-spacing:1px;
                 line-height:1.02;
                 background:linear-gradient(180deg,#fff 18%,var(--wincol,var(--gold)) 92%);
                 -webkit-background-clip:text; background-clip:text; color:transparent;
                 -webkit-text-stroke:1px rgba(5,7,13,.55); }
  #banner .sub { grid-area:sub; font-size:14px; color:var(--dim); margin-top:4px;
                 letter-spacing:.08em; text-transform:uppercase; }
  #vignette { position:absolute; inset:0; pointer-events:none; z-index:3;
              box-shadow: inset 0 0 240px 40px #000a, inset 0 0 80px 0 #0006; }
  /* live scoreboard rail (FFA / >2 sides only — 1v1 team matches get #scorebug) */
  #scoreboard { position:absolute; top:14px; right:16px; width:300px; display:flex; flex-direction:column;
                gap:5px; z-index:4; pointer-events:none; }
  .sb-row { display:flex; align-items:center; gap:8px; background:#0F1011cc; border:1px solid var(--line);
            border-radius:6px; padding:6px 9px; font-size:16px; backdrop-filter:blur(4px); transition:opacity .3s; }
  .sb-row.dead { opacity:.4; filter:grayscale(1); }
  .sb-chip { width:11px; height:11px; border-radius:3px; flex:0 0 auto; box-shadow:0 0 8px currentColor; }
  .sb-name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; }
  .sb-bar { flex:0 0 90px; height:10px; background:var(--raised); border-radius:3px; overflow:hidden; }
  .sb-bar i { display:block; height:100%; width:100%; background:var(--accent); transition:width .15s; }
  .sb-bar i.low { animation:hpPulse .7s ease-in-out infinite; }
  .sb-ammo { flex:0 0 auto; color:var(--dim); font-family:var(--font-mono);
             font-variant-numeric:tabular-nums; font-size:11px; }
  .sb-ammo svg { vertical-align:-1px; }
  .sb-dmg { flex:0 0 auto; color:var(--gold); font-family:var(--font-mono);
            font-variant-numeric:tabular-nums; font-size:11px; min-width:26px; text-align:right; }
  .sb-team { display:flex; align-items:center; gap:7px; margin-top:8px; padding:3px 8px 3px 6px;
             border-left:3px solid var(--tc); border-radius:3px; background:#0F1011aa;
             text-transform:uppercase; letter-spacing:1.5px; font-weight:800; font-size:12px; }
  .sb-team:first-child { margin-top:0; }
  .sb-team.out { opacity:.45; filter:grayscale(1); }
  .sb-tdot { width:11px; height:11px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 10px currentColor; }
  .sb-tname { flex:1; color:var(--ink); }
  .sb-tcount { flex:0 0 auto; color:var(--tc); font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  #scoreboard.teams .sb-row { margin-left:10px; }
  /* esports scorebug (1v1 team format): [plate A][clock][plate B], top-center */
  #scorebug { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:4;
              display:flex; align-items:stretch; pointer-events:none; }
  /* clamp (not a fixed width) so both plates shrink together on a narrower projector/window
     instead of being silently clipped by html/body's overflow:hidden; unchanged at 1920px+.
     This block is a DUPLICATE of the one in arena.template.html — tournament.html never
     loads that file, so a fix applied there alone does nothing here. Keep the two in sync. */
  .sbg-plate { display:flex; align-items:center; gap:12px; width:clamp(340px,30vw,460px); padding:10px 16px;
               background:#0F1011f2; border:1px solid var(--line);
               box-shadow:inset 0 -3px 0 var(--team-col); }
  .sbg-plate.right { flex-direction:row-reverse; }
  .sbg-name { flex:1; min-width:0; font:800 18px/1 var(--font-display); text-transform:uppercase;
              letter-spacing:.04em; color:var(--ink); white-space:nowrap; overflow:hidden;
              text-overflow:ellipsis; }
  .sbg-plate.right .sbg-name { text-align:right; }
  .sbg-hp { position:relative; width:190px; height:13px; background:#1C1C1F; border-radius:2px; flex:0 0 auto; }
  .sbg-hp i { position:absolute; top:0; left:0; height:100%; border-radius:2px; }
  .sbg-plate.right .sbg-hp i { left:auto; right:0; }
  .sbg-hp .ghost { background:#fff; opacity:.35; transition:width .5s ease .25s; }
  .sbg-hp .fill { transition:width .15s; background:var(--team-col); }
  .sbg-hp.low .fill { animation:hpPulse .7s ease-in-out infinite; }
  @keyframes hpPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #sbg-mid { display:flex; flex-direction:column; align-items:center; justify-content:center;
             min-width:118px; background:var(--bg); border:1px solid var(--line-2); padding:6px 12px; }
  #sbg-clock { font:800 32px/1 var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink); }
  .sbg-round { font:700 9px/1.2 var(--font-display); letter-spacing:.3em; text-transform:uppercase;
               color:var(--dim); margin-top:4px; max-width:200px; white-space:nowrap; overflow:hidden;
               text-overflow:ellipsis; }
  /* round timer (top-center; hidden while the scorebug clock is live) */
  #timer { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:4; pointer-events:none;
           font:800 36px/1.1 var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:2px;
           color:var(--ink); background:#0F1011cc; border:1px solid var(--line); border-radius:8px;
           padding:5px 16px; text-shadow:0 0 12px #000; backdrop-filter:blur(4px); }
  #weather { position:absolute; top:64px; left:50%; transform:translateX(-50%); z-index:4; pointer-events:none;
             font-size:13px; font-weight:800; letter-spacing:3px; color:#cfe0ff;
             background:#0F1011cc; border:1px solid var(--line); border-radius:7px; padding:3px 12px;
             backdrop-filter:blur(4px); display:none; }
  /* lower-third event bar (single broadcast surface: ticker + kills) */
  #ticker { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); z-index:4;
            pointer-events:none; display:flex; flex-direction:column; align-items:center; }
  .tk { background:#0F1011f2; border:1px solid var(--line); border-left:3px solid var(--accent);
        border-radius:4px; padding:10px 22px; font:700 16px/1.2 var(--font-display);
        letter-spacing:.05em; text-transform:uppercase; color:var(--ink); min-width:420px;
        text-align:center; opacity:0; transform:translateY(14px); transition:opacity .3s, transform .3s; }
  .tk.show { opacity:1; transform:none; }
  .tk.kill { border-left-color:var(--red); font-size:24px; }
  /* FIGHT! stinger — broadcast type over its own dark scrim */
  #stinger { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:6;
             pointer-events:none; opacity:0; letter-spacing:.025em; white-space:nowrap;
             font:italic 900 clamp(120px,16vw,240px)/1 var(--font-display);
             background:linear-gradient(180deg,#fff 15%,#ffd93d 55%,#ff6905 100%);
             -webkit-background-clip:text; background-clip:text; color:transparent;
             -webkit-text-stroke:3px rgba(5,7,13,.85);
             filter:drop-shadow(0 6px 0 rgba(0,0,0,.5)) drop-shadow(0 0 70px rgba(255,105,5,.5)); }
  #stinger::before { content:''; position:absolute; inset:0; z-index:-1; opacity:0;
             background:radial-gradient(ellipse at center,rgba(3,5,10,0) 20%,rgba(3,5,10,.78) 80%); }
  #stinger.go { animation:stingerPop .7s ease-out forwards; }
  #stinger.go::before { animation:stingerScrim .7s ease-out forwards; }
  @keyframes stingerPop { 0%{opacity:0; transform:scale(1.5)} 8%{opacity:1; transform:scale(1)}
                          70%{opacity:1; transform:scale(1.04)} 100%{opacity:0; transform:scale(1.12)} }
  @keyframes stingerScrim { 0%{opacity:0} 8%{opacity:1} 70%{opacity:1} 100%{opacity:0} }
  #titlecard { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
               justify-content:center; z-index:6; pointer-events:none; opacity:0; transition:opacity .5s;
               background:radial-gradient(ellipse at center, #03050a88, #03050aee); }
  #titlecard.show { opacity:1; }
  #titlecard .tc-title { font-size:76px; font-weight:900; letter-spacing:4px; color:var(--accent);
                         text-shadow:0 0 50px #3fd0c9aa, 0 6px 14px #000; }
  #titlecard .tc-tag { font-size:18px; letter-spacing:6px; text-transform:uppercase; color:var(--ink); margin-top:4px; }
  #titlecard .tc-sub { font-size:16px; color:var(--dim); margin-top:14px; letter-spacing:1px; }
  #letterbox { position:absolute; inset:0; z-index:5; pointer-events:none; }
  #letterbox::before, #letterbox::after { content:""; position:absolute; left:0; right:0; height:0; background:#000;
        transition:height .4s ease; }
  #letterbox::before { top:0; } #letterbox::after { bottom:0; }
  #letterbox.show::before, #letterbox.show::after { height:11vh; }
  /* flash sits BELOW the stinger's z-index 6 so FIGHT never gets whited out */
  #flash { position:absolute; inset:0; z-index:5; pointer-events:none; background:#fff; opacity:0; }
</style>
</head>
<body>
  <!-- always-on leaderboard strip (filled by tournament.app.js) -->
  <div id="lb-strip"><span class="lbs-label">Leaderboard</span></div>

  <!-- ===== BRACKET VIEW ===== -->
  <div id="bracketview">
    <div id="bhead">
      <h1>ROBOT <b>WARS</b> · TOURNAMENT</h1>
      <span class="tag" id="subtag">Robot Wars</span>
      <span class="spacer"></span>
      <button id="playnext">PLAY NEXT MATCH</button>
      <button id="awardsbtn" hidden>AWARDS</button>
    </div>
    <div id="bbody">
      <div id="bracket"></div>
      <div id="leaderboard">
        <h2>Leaderboard</h2>
        <div id="lb-rows"></div>
        <div class="lb-note">Click the highlighted match (or “Play next”) to watch it on the big screen.
          Winners and the next round fill in as you go.</div>
      </div>
    </div>
  </div>

  <!-- ===== MATCH VIEW (3D arena) ===== -->
  <div id="matchview">
    <div id="mwrap">
      <div id="mbar">
        <button id="back">‹ BACK TO BRACKET</button>
        <h1>ROBOT <b>WARS</b></h1>
        <span class="mtitle" id="mtitle"></span>
        <button id="play">PLAY</button>
        <button id="restart">RESTART</button>
        <button id="autocam" aria-pressed="true">AUTO-CAM</button>
        <button id="voice" aria-pressed="false">VOICE</button>
        <button id="music" aria-pressed="false">MUSIC</button>
        <label class="file">Load match<input id="file" type="file" accept=".jsonl,.json,.txt"></label>
        <span class="spacer"></span>
        <span class="speedlbl">Speed</span> <input id="speed" type="range" min="10" max="80" value="18">
        <span id="speedval" class="speedval">18 fps</span>
      </div>
      <div id="stage">
        <canvas id="cv"></canvas>
        <div id="vignette"></div>
        <div id="letterbox"></div>
        <div id="hud"></div>
        <div id="timer">00:00</div>
        <div id="weather"></div>
        <div id="scoreboard"></div>
        <div id="ticker"></div>
        <div id="stinger"></div>
        <div id="titlecard">
          <div class="tc-title">ROBOT WARS</div>
          <div class="tc-tag">Robot Wars</div>
          <div class="tc-sub"></div>
        </div>
        <div id="flash"></div>
        <div id="banner"><div class="who"></div><div class="sub"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== AWARDS (end of day: champion + honorable mentions, typed live) ===== -->
  <div id="awards">
    <button id="aw-close">✕ Close</button>
    <div class="aw-lbl">Robot Wars</div>
    <div class="aw-cup">🏆</div>
    <div class="aw-champ" id="aw-champ">TBD</div>
    <div class="aw-hm-title">Honorable Mentions</div>
    <div class="aw-hm" id="aw-hm">
      <div class="aw-mention" contenteditable="true"></div>
      <div class="aw-mention" contenteditable="true"></div>
    </div>
    <button id="aw-add">+ ADD MENTION</button>
  </div>
<!--THREE--><!--TOURNAMENT_DATA--><!--VOICE--><!--ARENA_APP--><!--TOURNAMENT_APP--></body>
</html>
